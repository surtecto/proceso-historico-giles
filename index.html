<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Línea histórica de San Andrés de Giles de 1699 a hoy: hechos del pueblo, del campo y del país, con fotos, planos y censos, en círculos que se abren al avanzar en el tiempo.">
<meta property="og:title" content="San Andrés de Giles, su proceso">
<meta property="og:description" content="Línea histórica de San Andrés de Giles de 1699 a hoy: hechos del pueblo, del campo y del país, con fotos, planos y censos, en círculos que se abren al avanzar en el tiempo.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>San Andrés de Giles, su proceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..700;1,400..700&family=Saira:wdth,wght@50..125,300..700&family=Saira+Stencil+One&display=swap">
<style>
/* Lámina de plano: escenario de círculos anidados a la izquierda; a la derecha, el rótulo del hecho local
   y el pliego del país; al pie, la escala de los años con la curva de los censos.
   Claro = copia heliográfica (diazo); oscuro = cianotipo. Colores de capa según convención de mensura. */
:root{
  --paper:#F5F5F0; --sheet:#FBFBF8; --panel:#EEEEEA;
  --ink:#23264F; --ink-2:#585B83; --line:#C9CAD6; --line-2:#DCDDE5;
  --diazo:#2F3489;
  --carmin:#B3203E; --verde:#2C6A3C; --azul:#2D5FA5; --amarillo:#9E6E00;
  --duo-dark:#262A6B; --duo-light:#F5F5F0;
  --f-stencil:"Saira Stencil One","Saira","Arial Narrow",sans-serif;
  --f-ui:"Saira","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-read:"Alegreya",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F2D4B; --sheet:#11335A; --panel:#0C2742;
    --ink:#EAF2F9; --ink-2:#A7C1D8; --line:#2E5378; --line-2:#244668;
    --diazo:#D8E8F6;
    --carmin:#FF9BB0; --verde:#9ADCAB; --azul:#AACDFF; --amarillo:#FFD45E;
    --duo-dark:#0A2443; --duo-light:#DCEAF6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F2D4B; --sheet:#11335A; --panel:#0C2742;
  --ink:#EAF2F9; --ink-2:#A7C1D8; --line:#2E5378; --line-2:#244668;
  --diazo:#D8E8F6;
  --carmin:#FF9BB0; --verde:#9ADCAB; --azul:#AACDFF; --amarillo:#FFD45E;
  --duo-dark:#0A2443; --duo-light:#DCEAF6;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--diazo);outline-offset:2px}
.k{font-family:var(--f-ui);font-stretch:72%;font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 344px 332px;grid-template-rows:auto minmax(0,1fr) auto}

/* Encabezado */
.top{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;
  padding-block:12px 11px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.mast h1{margin:0;font-family:var(--f-stencil);font-weight:400;font-size:clamp(20px,2.3vw,30px);line-height:1;letter-spacing:.04em;text-transform:uppercase;color:var(--diazo)}
.back{align-self:center;flex:none;border:1px solid var(--line);padding:5px 10px;text-decoration:none;font-stretch:80%;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.back:hover{color:var(--ink);border-color:var(--ink-2)}
.mast p{margin:0;font-family:var(--f-read);font-style:italic;font-size:clamp(16px,1.5vw,20px);color:var(--ink-2)}
.tools{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 4px;cursor:pointer;font-stretch:85%;font-weight:500;font-size:13px;letter-spacing:.03em}
.layer i{display:block;width:22px;height:0;border-top:3px solid var(--c)}
.layer[aria-pressed="false"]{opacity:.42}
.layer[aria-pressed="false"] i{border-top-style:dotted}
.layer[data-l="p"]{--c:var(--carmin)} .layer[data-l="c"]{--c:var(--verde)} .layer[data-l="x"]{--c:var(--azul)}
.loss-key{display:inline-flex;align-items:center;gap:8px;font-stretch:85%;font-size:13px;color:var(--ink-2)}
.loss-key i{display:block;width:22px;height:0;border-top:3px dashed var(--amarillo)}
.btn{border:1px solid var(--line);background:transparent;padding:6px 12px;font-size:12.5px;font-stretch:85%;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}

/* Escenario */
.stage{grid-column:1;grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sheet);touch-action:none}
.stage::before,.stage::after{content:"";position:absolute;pointer-events:none;z-index:2}
.stage::before{inset:10px;border:1px solid var(--line)}
.stage::after{inset:15px;border:2px solid var(--line-2)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.corner{position:absolute;z-index:3;margin:0;pointer-events:none}
.corner.tl{left:26px;top:22px}
.corner.tr{right:26px;top:22px;text-align:right}
.corner.bl{left:26px;bottom:22px;max-width:60%}
.corner .k{display:block}
.corner b{font-family:var(--f-stencil);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--ink)}
.hint{font-family:var(--f-read);font-style:italic;font-size:13.5px;color:var(--ink-2)}

/* Rótulo del hecho */
.col{min-height:0;overflow:auto;border-left:1px solid var(--line)}
.ficha{grid-column:2;grid-row:2;background:var(--paper)}
.ficha-in{padding:20px 20px 24px;display:flex;flex-direction:column;gap:10px}
.f-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lay{display:inline-flex;align-items:center;gap:7px}
.lay i{display:block;width:18px;border-top:3px solid var(--c)}
.lay.p{--c:var(--carmin)} .lay.c{--c:var(--verde)} .lay.x{--c:var(--azul)}
.lay.neg i{border-top-style:dashed;--c:var(--amarillo)}
.f-year{font-family:var(--f-stencil);font-size:76px;line-height:.9;letter-spacing:.01em;color:var(--c,var(--diazo));font-variant-numeric:lining-nums}
.f-year.p{--c:var(--carmin)} .f-year.c{--c:var(--verde)} .f-year.x{--c:var(--azul)} .f-year.neg{--c:var(--amarillo)}
.ficha h2{margin:0;font-family:var(--f-ui);font-weight:600;font-stretch:92%;font-size:21px;line-height:1.2;text-wrap:balance}
.f-note{margin:0;font-family:var(--f-read);font-style:italic;font-size:18px;line-height:1.3;color:var(--ink-2)}
.f-detail{margin:0;font-family:var(--f-read);font-size:16.5px;line-height:1.5}
.f-fix{margin:2px 0 0;padding:2px 0 2px 12px;border-left:3px dashed var(--amarillo);font-family:var(--f-read);font-size:15px;line-height:1.45}
.f-fix b{display:block;font-family:var(--f-ui);font-stretch:72%;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amarillo);margin-bottom:2px}
.f-img{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.f-img .k{grid-column:1 / -1}
.thumb{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);padding:0;background:var(--sheet) center/cover no-repeat;cursor:zoom-in;filter:grayscale(1)}
.cap{margin:0;font-family:var(--f-read);font-style:italic;font-size:14.5px;line-height:1.4}
.credit{margin:3px 0 0;font-size:12px;color:var(--ink-2);font-stretch:90%}
.credit a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.rotulo{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-top:6px}
.rotulo > div{padding:7px 9px;border-top:1px solid var(--line);min-width:0}
.rotulo > div:nth-child(-n+2){border-top:0}
.rotulo > div:nth-child(2n){border-left:1px solid var(--line)}
.rotulo .wide{grid-column:1 / -1;border-left:0 !important}
.gob{display:block;margin-top:3px;font-weight:600;font-stretch:92%;font-size:15px;line-height:1.25}
.gob-era{display:block;margin-top:2px;font-family:var(--f-read);font-style:italic;font-size:14px;line-height:1.35;color:var(--ink-2)}
.gob-link{display:inline-block;margin-top:5px;font-size:12.5px;font-stretch:90%;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.rotulo .v{display:block;font-family:var(--f-stencil);font-size:15px;letter-spacing:.04em;margin-top:1px}
.rotulo .src{display:flex;flex-direction:column;gap:2px;margin-top:3px;font-size:12.5px;font-stretch:90%}
.rotulo .src a{overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}

/* Pliego del país */
.pais{grid-column:3;grid-row:2;background:var(--panel)}
.pais-in{padding:20px 20px 24px;display:flex;flex-direction:column;gap:12px}
.pais-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.pais-h h3{margin:0;font-family:var(--f-stencil);font-weight:400;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.pais-card{display:flex;flex-direction:column;gap:7px}
.press{position:relative;margin:0;background:var(--sheet);border:1px solid var(--line);aspect-ratio:4 / 3;max-width:100%;overflow:hidden;cursor:zoom-in;padding:0}
.press img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.press.empty{cursor:default;display:grid;place-items:center;aspect-ratio:auto;min-height:72px;font-family:var(--f-read);font-style:italic;color:var(--ink-2);font-size:14px;padding:14px}
.p-year{font-family:var(--f-stencil);font-size:42px;line-height:.95;color:var(--ink)}
.p-rel{font-size:12px;font-stretch:85%;color:var(--ink-2);letter-spacing:.04em}
.pais h4{margin:0;font-weight:600;font-stretch:92%;font-size:18px;line-height:1.2;text-wrap:balance}
.p-detail{margin:0;font-family:var(--f-read);font-size:15.5px;line-height:1.45}
.p-list{list-style:none;margin:4px 0 0;padding:0;border-top:1px solid var(--line)}
.p-list button{display:grid;grid-template-columns:44px 40px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 0;cursor:pointer}
.p-list button:hover .t{text-decoration:underline;text-decoration-color:var(--line)}
.p-list .y{font-family:var(--f-stencil);font-size:15px}
.p-list .tn{width:40px;height:30px;background:var(--sheet) center/cover no-repeat;filter:grayscale(1);border:1px solid var(--line)}
.p-list .t{font-size:13.5px;line-height:1.25;font-stretch:92%}
.p-list .cur{background:var(--sheet)}

/* Pie */
.bottom{grid-column:1 / -1;grid-row:3;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;align-items:center;
  padding-block:8px 10px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
.ctrl{display:flex;gap:6px;align-items:center}
.nav{width:40px;height:40px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.nav:hover{border-color:var(--ink)}
.nav svg{width:16px;height:16px}
#play{height:40px;min-width:104px}
#play[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.line{min-width:0}
#tl{display:block;width:100%;height:124px;cursor:pointer;touch-action:none}
.pop-now{min-height:15px;text-align:right;font-size:11.5px;font-stretch:88%;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pop-now b{color:var(--ink);font-weight:600}
#tl text{font-family:var(--f-ui);font-stretch:85%;font-size:10.5px;fill:var(--ink-2)}
#tl .ax{stroke:var(--line)}
#tl .pop{fill:var(--diazo);fill-opacity:.07;stroke:none}
#tl .popline{fill:none;stroke:var(--diazo);stroke-width:1.5}
#tl .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
#tl .ylbl{font-size:9.5px}
#tl .ptcur{fill:var(--diazo);stroke:var(--sheet);stroke-width:1.5}
#tl .poptxt{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
#tl .poptit{font-size:9.5px;font-stretch:72%;font-weight:600;letter-spacing:.12em;fill:var(--ink-2)}
#tl .urb{fill:none;stroke:var(--carmin);stroke-width:1.3;stroke-dasharray:3 2}
#tl .rur{fill:none;stroke:var(--verde);stroke-width:1.5}
#tl .pt{fill:var(--sheet);stroke:var(--diazo);stroke-width:1.3}
#tl .tick{stroke-width:1.5}
#tl .tick.p{stroke:var(--carmin)} #tl .tick.c{stroke:var(--verde)} #tl .tick.x{stroke:var(--azul)} #tl .tick.neg{stroke:var(--amarillo)}
#tl .ntick{stroke:var(--ink-2);stroke-width:1.2}
#tl .cur{stroke:var(--ink);stroke-width:2}
#tl .curlbl{font-family:var(--f-stencil);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
#tl .row{font-stretch:72%;font-weight:600;letter-spacing:.12em;font-size:9.5px}
#tl .poplbl{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-stretch:85%;color:var(--ink-2)}
.legend i{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:5px}

/* Capas superpuestas */
.overlay{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding-block:max(18px, env(safe-area-inset-top, 0px)) 40px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;max-width:1040px;margin:0 auto 14px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.ov-head h2{margin:0;font-family:var(--f-stencil);font-weight:400;font-size:26px;letter-spacing:.05em;text-transform:uppercase}
.ix-body{max-width:1040px;margin:0 auto;columns:2 400px;column-gap:44px}
.cent{break-inside:avoid;margin:0 0 18px}
.cent h3{margin:0 0 6px}
.cent ol{list-style:none;margin:0;padding:0}
.cent button{display:grid;grid-template-columns:50px 1fr;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:4px 0;cursor:pointer;border-bottom:1px solid transparent}
.cent button:hover{border-bottom-color:var(--line)}
.cent .y{font-family:var(--f-stencil);color:var(--c)}
.cent .y.p{--c:var(--carmin)} .cent .y.c{--c:var(--verde)} .cent .y.x{--c:var(--azul)} .cent .y.neg{--c:var(--amarillo)} .cent .y.n{--c:var(--ink)}
.cent .t{font-size:14px;line-height:1.3}
.cent .ph{font-size:10px;letter-spacing:.1em;color:var(--ink-2);margin-left:6px;font-stretch:80%;text-transform:uppercase}
.about{max-width:1040px;margin:22px auto 0;padding-top:14px;border-top:1px solid var(--line);font-family:var(--f-read);font-size:15.5px;line-height:1.55;color:var(--ink-2)}
.about p{max-width:74ch;margin:0 0 9px}
.lb{display:flex;flex-direction:column}
.lb .ov-head{width:100%;max-width:1200px}
.lb-body{flex:1;min-height:0;display:grid;place-items:center;max-width:1200px;width:100%;margin:0 auto}
.lb-body img{max-width:100%;max-height:72vh;object-fit:contain;border:1px solid var(--line);background:var(--sheet)}
.lb-cap{max-width:1200px;width:100%;margin:12px auto 0}

@media (max-width:1179px){
  .app{grid-template-columns:minmax(0,1fr) 360px}
  .ficha{grid-column:2;grid-row:2}
  .pais{grid-column:2;grid-row:2;display:none}
  .side-wrap .pais{display:block;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;display:flex;flex-direction:column}
  .top{order:1} .stage{order:2} .bottom{order:3} .ficha{order:4}
  .stage{height:54vh;min-height:340px;flex:none}
  .tools{gap:2px 10px}
  .col{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .ficha-in,.pais-in{padding:16px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px))}
  .f-year{font-size:56px}
  .corner.tr,.corner .hint{display:none}
  .bottom{grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--line)}
  .ctrl{justify-content:center}
  #tl{height:104px}
  .legend{display:none}
  .mast p{display:none}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="mast">
      <a class="back" href="https://surtecto.github.io/WEB-Plan-SAG-V3/#educacion" title="Volver al Aula del Plan de San Andrés de Giles">← Plan SAG</a>
      <h1>San Andrés de Giles</h1>
      <p>su proceso, 1699–2026</p>
    </div>
    <div class="tools" role="group" aria-label="Capas">
      <button class="layer" data-l="p" aria-pressed="true"><i></i>Pueblo</button>
      <button class="layer" data-l="c" aria-pressed="true"><i></i>Campo</button>
      <button class="layer" data-l="x" aria-pressed="true"><i></i>Contexto</button>
      <span class="loss-key"><i></i>Pérdidas</span>
      <button class="btn" id="btn-index" aria-haspopup="dialog">Índice</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Círculos anidados de la línea histórica de San Andrés de Giles"></canvas>
    <p class="corner tr"><span class="k">Adentro · afuera</span><b id="c-dir"></b></p>
    <p class="corner bl"><span class="hint">Rueda, flechas o deslizar para recorrer. Clic en un círculo para entrar o salir.</span></p>
  </main>

  <aside class="col ficha" aria-live="polite">
    <div class="ficha-in">
      <div class="f-head"><span class="k lay" id="f-layer"><i></i><span></span></span><span class="k" id="f-kind"></span></div>
      <div class="f-year" id="f-year"></div>
      <h2 id="f-title"></h2>
      <p class="f-note" id="f-note"></p>
      <p class="f-detail" id="f-detail"></p>
      <p class="f-fix" id="f-fix" hidden></p>
      <div class="f-img" id="f-img" hidden>
        <span class="k">Imagen</span>
        <button class="thumb" id="f-thumb" aria-label="Ver la imagen ampliada"></button>
        <div><p class="cap" id="f-cap"></p><p class="credit" id="f-credit"></p></div>
      </div>
      <div class="rotulo">
        <div><span class="k">Lámina</span><span class="v" id="r-lam"></span></div>
        <div><span class="k">Imagen</span><span class="v" id="r-kind"></span></div>
        <div class="wide" id="r-gob-wrap"><span class="k">Gobierno local</span><span class="gob" id="r-gob"></span><span class="gob-era" id="r-era"></span><a class="gob-link" href="https://surtecto.github.io/HCD-SAG-Digesto2026/autoridades.html" target="_blank" rel="noopener">Historia de nuestras autoridades <span aria-hidden="true">↗</span></a></div>
        <div class="wide" id="r-src-wrap"><span class="k">Fuentes</span><div class="src" id="r-src"></div></div>
      </div>
    </div>
  </aside>

  <aside class="col pais" id="pais" aria-live="polite">
    <div class="pais-in">
      <div class="pais-h"><h3>En el país</h3><span class="k" id="p-span"></span></div>

<script type="application/json" id="data">{"eventos":[{"y":1699,"t":"Las tierras de los Giles se unen a la estancia de Ruiz de Arellano","d":"El militar José Ruiz de Arellano se casa con la heredera de los Giles; por esa vía las tierras del Pago de Areco, con la cañada que lleva el apellido, quedan unidas a su estancia.","L":"c","conf":"media","src":["https://www.sanandresdegiles.gob.ar/historia","https://www.welcomeargentina.com/sanantoniodeareco/historia.html"],"v":"+"},{"y":1706,"t":"Pedro de Giles, alcalde del Cabildo porteño","d":"Pedro de Giles es elegido alcalde de primer voto de Buenos Aires. Su familia tenía una merced de tierras, sin fecha documentada, sobre el Areco y a lo largo de la cañada que tomó su nombre.","L":"x","conf":"media","src":["https://intranet.hcdiputados-ba.gov.ar/proyectos/12-13D3036012018-10-0810-31-53.pdf"],"v":"+","img":{"id":"L01","cap":"Plano de Buenos Aires en 1713, por José Bermúdez.","kind":"epoca","fy":0.5}},{"y":1730,"t":"Capilla de San Antonio de Areco","d":"La capilla levantada en la estancia de Ruiz de Arellano se dedica a San Antonio para pedir el fin de los malones. Es el núcleo religioso del Pago de Areco, del que dependerá Giles.","L":"x","conf":"media","src":["https://www.welcomeargentina.com/sanantoniodeareco/historia.html"],"v":"+"},{"y":1738,"t":"Gran malón sobre Areco y Arrecifes","d":"Unos dos mil indígenas invaden Areco y Arrecifes. Los malones marcan la vida del pago durante buena parte del siglo XVIII.","L":"x","v":"-","conf":"media","src":["https://www.redalyc.org/pdf/127/12701808.pdf"],"img":{"id":"L02","cap":"El malón, de Johann Moritz Rugendas, 1845.","kind":"epoca","fy":0.5}},{"y":1753,"t":"Las tierras de la cañada pasan a los Suero y Giles","d":"Muere María Rosa de Giles; por un segundo casamiento de su viudo, los bienes terminan en los herederos Suero y Giles, de quienes saldrá la donación de 1793.","L":"c","conf":"media","src":["https://www.sanandresdegiles.gob.ar/historia"],"v":"+"},{"y":1755,"t":"Estancia La Merced, posta del camino real","d":"Tomás Figueroa funda la estancia La Merced, que funcionará como posta del camino a Cuyo. Otras fuentes la datan hacia 1800.","L":"c","conf":"media","src":["https://www.diagonales.com/municipio/san-andres-de-giles--211-anos-de-existencia_a6213a33c5e6cc543af4a1e44"],"v":"+","img":{"id":"L03","cap":"Pulpería de campaña en Buenos Aires, acuarela de Juan León Pallière, hacia 1858.","kind":"epoca","fy":0.5}},{"y":1779,"t":"Plan de frontera del virrey Vértiz","d":"Se propone a Luján y Salto como guardias principales y a Areco como fortín menor. La frontera empieza a correrse hacia el oeste.","L":"x","conf":"media","src":["https://www.redalyc.org/pdf/127/12701808.pdf"],"v":"+"},{"y":1780,"t":"Fuerte San Claudio de Areco","d":"El 1 de enero se funda el fuerte y pueblo de San Claudio de Areco, hoy Carmen de Areco, que aleja la frontera de la Cañada de Giles.","L":"x","conf":"media","src":["https://es.wikipedia.org/wiki/Carmen_de_Areco"],"v":"+"},{"y":1793,"t":"Donación de tierras por Don Juan Fco. de Suero","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/historia"],"d":"Juan Francisco de Suero y Giles, heredero de las tierras de los Giles, donó 600 varas frente a la Cañada de Giles para levantar un oratorio y trazar un pueblo."},{"y":1794,"t":"Unos 150 pobladores en la Cañada de Giles","d":"Una declaración de febrero de 1794 estima alrededor de 150 habitantes en la cañada, el primer registro de población del lugar.","L":"c","conf":"media","src":["https://infociudad.com.ar/2022/05/20/como-fue-el-primer-censo-en-san-andres-de-giles/"],"v":"+"},{"y":1798,"t":"Posesión de la donación por el cura Vicente Piñero","L":"p","v":"+","fix":"No se halló una fuente para la toma de posesión en 1798. La historia local registra la ratificación de la donación en 1797, y el municipio indica que Piñero obtuvo los permisos en octubre de 1800.","src":["https://www.sanandresdegiles.gob.ar/historia"]},{"y":1800,"t":"Piñero obtiene los permisos y traza el pueblo","d":"En octubre el cura Vicente Piñero recibe la licencia y empieza el oratorio de barro y teja. Ya había delineado los lotes, y llegaban los primeros pobladores, con ranchos cercados de tunas.","L":"p","conf":"alta","src":["https://www.sanandresdegiles.gob.ar/historia"],"v":"+"},{"y":1806,"t":"Primera misa en la Capilla de Giles","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/historia"],"d":"El 30 de noviembre de 1806, día de San Andrés Apóstol, se celebró la primera misa en el oratorio. El partido toma esa fecha como fundación del pueblo.","img":{"id":"L50","cap":"La plaza San Martín, primera plaza del pueblo, con el Palacio Municipal al fondo y el monumento de 1912 al centro. Fotografía de la primera mitad del siglo XX.","kind":"giles","fy":0.5}},{"y":1821,"t":"Fin de los Cabildos y creación de la Provincia","L":"x","n":"Círculo de contexto en la línea original","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 24 de diciembre de 1821 se suprimió el Cabildo de Luján y se crearon las alcaldías de hermandad. Desde ese año el territorio de Giles quedó anexado al partido de Areco."},{"y":1821,"t":"Nombramiento del 1º Alcalde de Hermandad","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Carlos Casco fue el primer Alcalde de Hermandad de Giles."},{"y":1825,"t":"Postas en la Cañada de Giles","d":"Sobre el camino real de Luján a Areco, el viejo camino a Mendoza, se establecen postas, entre ellas la Posta de Giles.","L":"c","conf":"media","src":["https://www.sanandresdegiles.gob.ar/historia"],"v":"+","img":{"id":"L06","cap":"Un alto en el campo, de Prilidiano Pueyrredón, 1861.","kind":"epoca","fy":0.5}},{"y":1827,"t":"Ayudantía de Parroquia","n":"Formación de nuevo cementerio","L":"p","v":"+","fix":"La formación de un nuevo cementerio en 1827 no pudo verificarse en fuentes publicadas.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El oratorio pasa a ser Ayudantía de Parroquia, con capellán estable, dependiente de San Antonio de Areco."},{"y":1828,"t":"Dorrego, prisionero, se detiene en Giles","d":"La comitiva que lleva a Manuel Dorrego hacia Navarro hace un alto en Giles; desde allí escribe pidiendo salir del país.","L":"x","conf":"media","src":["https://www.diagonales.com/municipio/san-andres-de-giles--211-anos-de-existencia_a6213a33c5e6cc543af4a1e44"],"v":"+"},{"y":1829,"t":"Padrón vecinal para pedir la parroquia","d":"Los vecinos levantan un padrón de 1.469 personas para justificar la creación de la parroquia; la historiografía local lo considera posiblemente exagerado.","L":"p","conf":"baja","src":["https://infociudad.com.ar/2022/05/20/como-fue-el-primer-censo-en-san-andres-de-giles/"],"v":"+","img":{"id":"L10","cap":"Payada en una pulpería, de Carlos Morel, hacia 1840.","kind":"epoca","fy":0.5}},{"y":1830,"t":"Creación de la Parroquia","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 18 de noviembre de 1830 se crea la Parroquia San Andrés Apóstol.","img":{"id":"L05","cap":"Parroquia San Andrés Apóstol, Belgrano y San Martín. Foto de 2016.","kind":"hoy","fy":0.5}},{"y":1831,"t":"Sequía en la campaña","d":"En abril, durante una recorrida por la campaña castigada por la sequía, Juan Manuel de Rosas se aloja en la estancia La Merced.","L":"c","v":"-","conf":"media","src":["https://www.diagonales.com/municipio/san-andres-de-giles--211-anos-de-existencia_a6213a33c5e6cc543af4a1e44"]},{"y":1832,"t":"Nombramiento del 1º Juez de Paz","n":"Existencia del Partido","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 5 de enero de 1832 Juan Gregorio Carrasco es designado primer Juez de Paz. Esa fecha se toma como creación del partido, separado del de Areco.","img":{"id":"L13","cap":"El partido de San Andrés de Giles en la provincia de Buenos Aires.","kind":"plano","fy":0.5}},{"y":1834,"t":"Último encuentro de Rosas y Quiroga en La Merced","d":"En diciembre Rosas y Facundo Quiroga se ven por última vez en la estancia de Figueroa; Quiroga es asesinado en Barranca Yaco en febrero de 1835.","L":"c","conf":"alta","src":["https://normas.gba.gob.ar/documentos/VG8N7uM0.html"],"v":"+","img":{"id":"L07","cap":"Facundo Quiroga, retrato de Fernando García del Molino, 1839.","kind":"epoca","fy":0.3}},{"y":1840,"t":"Lavalle acampa en Giles","d":"En su campaña contra Rosas, Juan Lavalle acampa en Giles rumbo a Buenos Aires.","L":"x","conf":"media","src":["https://www.diagonales.com/municipio/san-andres-de-giles--211-anos-de-existencia_a6213a33c5e6cc543af4a1e44"],"v":"+"},{"y":1841,"t":"Finaliza la construcción del 1º Templo","n":"Inaugurado en 1845","L":"p","v":"+","fix":"Las fuentes no coinciden: la historia local da el 27 de diciembre de 1841 como inauguración del nuevo templo y 1845 como reemplazo del oratorio; otra fuente menciona una iglesia de 1840 y otra habilitada en 1864.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"]},{"y":1852,"t":"Inauguración del 3º Cementerio","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Inaugurado el 12 de julio de 1852 en Etcheverry, entre San Lorenzo e Ituzaingó."},{"y":1854,"t":"Creación de la Escuela Normal","n":"Constitución de la «Comisión Municipal»","L":"p","v":"+","fix":"En 1854 no hubo Escuela Normal: ese año se creó la primera escuela oficial, con clases para varones y niñas. El 6 de abril se constituyó la primera Comisión Municipal. Una Escuela Normal Popular funcionó recién en 1908, y la formación de maestros llegó en 1952.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"]},{"y":1855,"t":"Primera elección de municipales","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 11 de marzo de 1855. En febrero se habían dado nombre a las calles y a la Plaza de la Constitución."},{"y":1856,"t":"Visita del obispo Escalada","n":"Puesta de la Cruz","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 21 de octubre el obispo Mariano José de Escalada preside la procesión que erige la cruz.","img":{"id":"L11","cap":"Mariano José de Escalada, obispo de Buenos Aires. Grabado del siglo XIX.","kind":"epoca","fy":0.35}},{"y":1859,"t":"Primer alumbrado público","n":"A sebo","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Alumbrado público con velas de sebo."},{"y":1865,"t":"Límites del Partido","n":"Por decreto provincial, junto con otros partidos","L":"c","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Límites definitivos fijados bajo el gobierno de Mariano Saavedra; la historia local da 1864 o 1865.","img":{"id":"M3","cap":"Mapa de la provincia de Buenos Aires, de los ingenieros Silveyra y Duclout, 1890.","kind":"plano","fy":0.45}},{"y":1865,"t":"Edificios para las escuelas de varones y de niñas","d":"Se inauguran edificios escolares separados, en el terreno cedido el año anterior por el juez de paz Eustaquio Sosa.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1867,"t":"Habilitación del Edificio Municipal","n":"Actual esquina del Correo","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Primer edificio municipal, en San Martín y Moreno; alojaba también la Comisaría y el Juzgado de Paz."},{"y":1868,"t":"Epidemia de cólera","L":"p","v":"-","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Junto con la fiebre amarilla de 1871, motivó la construcción de un nuevo cementerio, el Sud."},{"y":1869,"t":"Primer censo nacional: 3.820 habitantes","d":"Entre los extranjeros del partido predominan los británicos, seguidos por italianos, españoles y franceses.","L":"c","conf":"media","src":["https://infociudad.com.ar/2022/05/20/como-fue-el-primer-censo-en-san-andres-de-giles/"],"v":"+","img":{"id":"L15","cap":"Peones de una estancia de Baradero, partido vecino, en 1883.","kind":"epoca","fy":0.45}},{"y":1871,"t":"Epidemia de fiebre amarilla","L":"p","v":"-","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"La misma epidemia que golpeó a Buenos Aires."},{"y":1872,"t":"Puente de hierro sobre la Cañada de Giles","d":"Se habilita un puente metálico en el viejo camino a Mendoza, que mejora el cruce de tropas y carretas.","L":"c","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1873,"t":"Reemplazo del alumbrado público","n":"Faroles a querosene","L":"p","v":"+"},{"y":1875,"t":"Inauguración del 4º cementerio","n":"Hoy cementerio «viejo»","L":"p","v":"+","fix":"El Cementerio Sud, hoy «viejo», se terminó el 29 de noviembre de 1873 y se inauguró en la Pascua de 1874. Se clausuró en 1919.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/cementerio_sud.pdf"]},{"y":1876,"t":"Donación del terreno para la 2ª plaza","n":"Hoy plaza Saraví","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 1 de agosto se inaugura la Plaza Colón, hoy Saraví, en terreno donado por Julio Saraví. Ese año funciona también un registro civil municipal."},{"y":1877,"t":"Inauguración del Telégrafo","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Primera oficina de telégrafo; la fuente local da septiembre o noviembre."},{"y":1877,"t":"Construcción de los primeros alambrados","L":"c","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El primer alambrado de campo del partido. Cerrar los campos fijó la propiedad, ordenó la hacienda y cambió el paisaje abierto de la llanura.","img":{"id":"L14","cap":"Recorriendo la estancia, de Prilidiano Pueyrredón, 1865.","kind":"epoca","fy":0.5}},{"y":1880,"t":"Primera estación de ferrocarril","n":"Azcuénaga","L":"c","v":"+","src":["https://es.wikipedia.org/wiki/Estaci%C3%B3n_Azcu%C3%A9naga"],"d":"Habilitada el 1 de abril de 1880 por el Ferrocarril Oeste, entonces de la Provincia, en el ramal Luján–Pergamino. Luego pasó al Central Argentino y a la línea Mitre; el tren de pasajeros dejó de pasar en 1978.","img":{"id":"L16","cap":"Carretas descargando en una estación de tren, hacia 1890. Archivo General de la Nación.","kind":"epoca","fy":0.5}},{"y":1881,"t":"Creación de la Comisaría","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"En Moreno y San Martín; se mudó a su sede actual en 1932."},{"y":1883,"t":"Sociedad Italiana de Socorros Mutuos","d":"Los inmigrantes italianos fundan la sociedad «Porvenir de Italia» el 22 de julio; la piedra fundamental de su sede se coloca en 1890.","L":"p","conf":"alta","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1884,"t":"Asociación Española de Socorros Mutuos","n":"Comienzos del Banco Provincia; inauguración de la Capilla Mte. de Novi","L":"p","v":"+","fix":"La capilla de Monte de Novi, del barrio de la Rawson, tiene fecha incierta: la historia local da 1844, 1884 y 1900.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"La Asociación Española se funda el 18 de mayo. El Banco Provincia abre su sucursal el 16 de abril, primera institución de crédito local; quiebra en 1893 y reabre en 1909."},{"y":1884,"t":"Límites del Ejido urbano","n":"Proyecto de ampliación del Ejido","L":"p","v":"+","fix":"No se halló fuente publicada para este dato. La historia local indica que hasta 1936 la calle Rawson era el límite de la planta urbana.","img":{"id":"D_antes_0","cap":"Las quintas sobre el arroyo en un plano de 1884; Pichetto y Larroca figuran también en las actas municipales de esos años.","kind":"plano","fy":0.5}},{"y":1884,"t":"Estación Franklin del Ferrocarril Pacífico","d":"El paraje Franklin nace con su estación, entre Mercedes y Chacabuco; las fuentes la fechan entre octubre de 1884 y 1885.","L":"c","conf":"media","src":["https://es.wikipedia.org/wiki/Franklin_(Buenos_Aires)"],"v":"+"},{"y":1886,"t":"Primer Intendente Municipal","n":"Julio Saraví","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"Primer intendente bajo la Ley Orgánica de Municipalidades.","img":{"id":"D_antes_1","cap":"Foja 64 de un libro de sesiones de la Municipalidad, hacia 1885: de hojas así sale lo que se sabe de estos años.","kind":"giles","fy":0.3}},{"y":1886,"t":"Sale El Censor, primer periódico local","d":"Aparece el 12 de septiembre; en 1895 le sigue La Voz de Giles.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1887,"t":"Creación de la Oficina del Correo","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"La historia local ubica en 1887 la llegada del servicio de correo; hubo una estafeta desde 1872. El edificio actual del Correo es de 1938.","img":{"id":"L27","cap":"El Correo en San Martín y Moreno, edificio de 1938. Foto de 2016.","kind":"hoy","fy":0.5}},{"y":1888,"t":"Creación del Registro Civil","L":"p","v":"+","src":["https://normas.gba.gob.ar/ar-b/ley/1888/2114/13502"],"d":"La Ley provincial 2114 creó el Registro Civil bonaerense y ese año abrió la oficina local."},{"y":1889,"t":"Llegada del Tranway Rural a Giles","n":"En 1897 pasa a FC Rural de la Provincia","L":"c","v":"+","src":["https://es.wikipedia.org/wiki/Ferrocarril_Central_de_Buenos_Aires"],"d":"El 24 de mayo llega el primer tren, a caballo, del Tranway Rural de Federico Lacroze. La tracción a vapor llega en 1892.","img":{"id":"L17","cap":"Coche de la Compañía Lacroze, hacia 1890.","kind":"epoca","fy":0.5}},{"y":1889,"t":"Nace Villa Ruiz con su estación","d":"El 24 de mayo llega el primer tren a caballo del Tranway Rural a la estación Ruiz, en tierras donadas por Lorenzo T. Ruiz y Gerónima Cucullú para la estación y el pueblo.","L":"c","conf":"alta","src":["https://es.wikipedia.org/wiki/Villa_Ruiz"],"v":"+","img":{"id":"L19","cap":"Estación Ruiz del antiguo Tranway Rural, en Villa Ruiz. Foto de 2009.","kind":"hoy","fy":0.5}},{"y":1891,"t":"Epidemia de viruela en el campo","d":"La viruela afecta sobre todo a la población rural del partido.","L":"c","v":"-","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"]},{"y":1892,"t":"Surgen pueblos rurales","n":"Villa Ruiz, luego Franklin, Cucullú…","L":"c","v":"+","fix":"Los pueblos rurales no surgieron juntos sino uno tras otro, con cada estación: Azcuénaga 1880, Franklin 1884, Villa Ruiz 1889, Heavy 1892, Solís 1894, Cucullú 1898, Tuyutí y Espora 1911, Villa Espil 1936.","src":["https://es.wikipedia.org/wiki/Villa_Ruiz","https://es.wikipedia.org/wiki/Franklin_(Buenos_Aires)"],"img":{"id":"P1890","cap":"Plano del partido hacia 1890, con estancias, postas, pulperías y puestos. Base de la Dirección de Geodesia; fotografía del archivo de J. P. Addesso.","kind":"plano","fy":0.5}},{"y":1892,"t":"El tren a vapor llega hasta Heavy","d":"El 17 de diciembre se habilita el tramo Giles–Heavy, con la parada Km 108. El nombre de la estación se atribuye por tradición al hacendado irlandés Patricio Heavy.","L":"c","conf":"alta","src":["https://es.wikipedia.org/wiki/Ferrocarril_Central_de_Buenos_Aires"],"v":"+","img":{"id":"L20","cap":"Estación Heavy del ramal Lacroze–Rojas. Foto de 2012.","kind":"hoy","fy":0.5}},{"y":1892,"t":"El partido se vuelve agrícola","d":"Las siembras suman unas 18.000 ha de trigo, 12.000 de maíz, 3.500 de lino, 2.000 de alfalfa y 1.200 de cebada.","L":"c","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+","img":{"id":"L21","cap":"Trilla en la provincia de Buenos Aires, entre 1908 y 1919.","kind":"epoca","fy":0.5}},{"y":1893,"t":"Quiebra y cierra el Banco Provincia local","d":"Tras la crisis de 1890 la sucursal cierra; reabre recién en 1909.","L":"p","v":"-","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"]},{"y":1894,"t":"Estación Solís, en la estancia de Roca","d":"El 16 de julio se habilita la estación del Ferrocarril Central Argentino, ramal Victoria–Pergamino, en tierras de la estancia La Argentina de Julio A. Roca.","L":"c","conf":"alta","src":["https://es.wikipedia.org/wiki/Sol%C3%ADs_(Buenos_Aires)"],"v":"+","img":{"id":"L22","cap":"Estación Solís, ex Ferrocarril Central Argentino. Foto de 2011.","kind":"hoy","fy":0.5}},{"y":1895,"t":"Nuevo brote de cólera","d":"La epidemia causa numerosas víctimas; se perfora un pozo semisurgente en la plaza para mejorar el agua.","L":"p","v":"-","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"]},{"y":1898,"t":"Alumbrado eléctrico","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El 8 de junio de 1898. Es distinto de la usina, instalada en 1911.","img":{"id":"D_notables_0","cap":"Una calle del centro cuando todavía se andaba a caballo. Sin fecha.","kind":"giles","fy":0.5}},{"y":1898,"t":"Cucullú nace de una donación ferroviaria","d":"El 29 de octubre Juan Simón de Cucullú cede tierras para una estación del ferrocarril de Lacroze y para el pueblo; otra fuente fecha la cesión en 1899.","L":"c","conf":"media","src":["https://es.wikipedia.org/wiki/Cucull%C3%BA","https://normas.gba.gob.ar/documentos/BdR9P4s7.html"],"v":"+","img":{"id":"L23","cap":"Estación Cucullú. Foto de 2018.","kind":"hoy","fy":0.5}},{"y":1900,"t":"Biblioteca Popular Alberdi","d":"Se funda la biblioteca, que en 1927 se instala en su local de 25 de Mayo y Belgrano.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1901,"t":"Roca dona tierras para el pueblo de Solís","d":"Frente a la estación se lotea el pueblo; en 1906 abre la Escuela N.º 8, también en terreno donado.","L":"c","conf":"media","src":["https://es.wikipedia.org/wiki/Sol%C3%ADs_(Buenos_Aires)"],"v":"+"},{"y":1904,"t":"Construcción del Hospital de Caridad","n":"Inaugurado en 1905","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/libro_hospital_texto.pdf"],"d":"Obra iniciada en terreno donado por José Pichetto y habilitada el 5 de septiembre de 1905. Desde 1976 depende directamente del Municipio."},{"y":1906,"t":"Primer monumento a Mitre del país, en el Tiro Federal","d":"El 30 de noviembre se inauguró en el polígono del Tiro Federal el monumento a Bartolomé Mitre, el primero levantado en el país en su homenaje, diez meses después de su muerte.","  de Felipe S. Espil.","kind":"giles","fy":0.3}},{"y":1914,"t":"Censo de 1914: 11.712 habitantes","d":"Hay 1.594 italianos y 690 españoles, entre otras procedencias: es el pico de la inmigración europea en el partido.","L":"c","conf":"media","src":["https://infociudad.com.ar/2022/05/20/como-fue-el-primer-censo-en-san-andres-de-giles/"],"v":"+","img":{"id":"L28","cap":"Niños en el Hotel de Inmigrantes de Buenos Aires, 1912. Archivo General de la Nación.","kind":"epoca","fy":0.4}},{"y":1914,"t":"Colegio Nuestra Señora de Luján","d":"A pedido de familias irlandesas abre el 1 de abril; su edificio actual es de 1919.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1918,"t":"Lillia, primer intendente por voto universal","d":"El médico Fernando C. Lillia es el primer intendente elegido bajo la ley Sáenz Peña; ese año la luz eléctrica se extiende hasta la medianoche.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"v":"+"},{"y":1919,"t":"Inauguración del nuevo cementerio","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/cementerio_norte.pdf"],"d":"Se inaugura el Cementerio Norte, con planos del arquitecto Luis B. Rocca, y se cierra definitivamente el Sud."},{"y":1927,"t":"Compra en remate de las tierras del Parque Municipal","L":"p","v":"+","fix":"No se confirmó que la compra fuera en remate: la fuente local indica que la Municipalidad compró el predio a José Pichetto.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"El predio del actual Parque Municipal, hoy Fernando Lillia, se arboló y urbanizó hacia 1930.","img":{"id":"D_secreto_0","cap":"Giles en una publicación de hacia 1927, con los retratos del intendente Jorge Morgan y del presidente del Concejo, el Palacio Municipal y el monumento.","kind":"giles","fy":0.3}},{"y":1930,"t":"Comienzo de la pavimentación","n":"Fundación del Club Colegiales","L":"p","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/historia_del_instituto_jorge_eduardo_coll-_orfilio_latorre.pdf"],"d":"A mediados de 1930 empieza el pavimento en la avenida Rivadavia, sobre una ordenanza de 1925; con bonos municipales se llegó a unas 60 cuadras céntricas.","img":{"id":"D_secreto_1","cap":"Autos sobre la avenida, a fines de los años veinte o comienzos de los treinta.","kind":"giles","fy":0.5}},{"y":1931,"t":"Capilla y maternidad del hospital","d":"El 20 de septiembre se inauguran la capilla y el pabellón de maternidad, con proyecto del arquitecto Domingo Sanz.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/libro_hospital_texto.pdf"],"v":"+"},{"y":1932,"t":"El Concejo Deliberante resuelve pavimentar 29 cuadras","n":"Se propone pavimentar la Av. Scully","L":"p","v":"+","fix":"No se halló la resolución de las 29 cuadras. La avenida recibió el nombre de Lucas Scully en 1923."},{"y":1933,"t":"Creación de la 3ª plaza, «Mitre»","n":"Av. Rivadavia con bulevar hasta la nueva Ruta 7","L":"p","v":"+","fix":"La Plaza Mitre existe, en el barrio de la Rawson, pero no se halló la fecha de su creación.","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/libro_hospital_texto.pdf"],"d":"El 14 de septiembre el Concejo impulsa la apertura de la avenida Rivadavia, hoy Cámpora, hacia la nueva Ruta 7."},{"y":1935,"t":"Plagas de langosta","d":"En las décadas de 1930 y 1940 se repiten las invasiones de langosta sobre los cultivos del partido.","L":"c","v":"-","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"]},{"y":1936,"t":"Inauguración de la Ruta Nacional 7","L":"c","v":"+","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/sintesis_historica_1930-1940_en_el_recuerdo_realidad_educativa_hoy_en_san_andres_de_giles_hector_f._felice.pdf"],"d":"La ruta llega a Giles el 5 de octubre de 1936, Día del Camino. Su asfalto por el partido se gestionó hacia 1938.","img":{"id":"D_treinta_1","cap":"Plano de un remate de lotes de 1939: ya dice «Ciudad de San Andrés de Giles» y lo cruza en diagonal el camino nacional.","kind":"plano","fy":0.5}},{"y":1936,"t":"Fundación de Villa Espil sobre la Ruta 7","d":"El Concejo acepta en septiembre la donación de Alberto Espil y el 22 de octubre se pone la piedra fundamental del pueblo, que lleva el nombre de su padre, el ex intendente Felipe S. Espil.","L":"c","conf":"alta","src":["https://es.wikipedia.org/wiki/Villa_Espil"],"v":"+"},{"y":1937,"t":"Declaración de Ciudad","L":"p","v":"+","src":["https://normas.gba.gob.ar/ar-b/ley/1937/4648/10597"],"d":"La Ley provincial 4648, promulgada el 31 de diciembre de 1937, declara ciudad al pueblo de San Andrés de Giles.","img":{"id":"D_treinta_0","cap":"Paseo por la plaza en los años treinta. Ninguna de ellas podía votar todavía.","kind":"giles","fy":0.4}},{"y":1938,"t":"Hogar infantil en el Parque Municipal","d":"Se termina el hogar de niños, hoy Instituto Jorge E. Coll, que recibe sus primeros internados en noviembre.","L":"p","conf":"media","src":["https://www.sanandresdegiles.gob.ar/sites/default/files/historia_del_instituto_jorge_eduardo_coll-_orfilio_latorre.pdf"],"v":"+"},{"y":1938,"t":"Escuela N.º 19 en Villa Espil","d":"El 8 de julio se inaugura la escuela del nuevo pueblo, en un lote de la donación de Espil; en 1939 se forma la Sociedad de Fomento.","L":"c","conf":"alta","src":["https://intranet.hcdiputados-ba.gov.ar/proyectos/11-12D1582012018-07-1112-43-51.pdf"],"v":"+"},{"y":1938,"t":"Primer libro municipal de historia local" ,"conf":"media","src":["https://hcdsanandresdegiles.com.ar/?s=museo"],"v":"+"},{"y":2000,"t":"Nace la Fiesta del Chancho Asado con Pelo","d":"Empezó en enero de 2000 en un potrero barrial con unas 350 personas, pasó al Parque Municipal y llegó a reunir más de diez mil. Se hizo hasta 2006.","L":"p","conf":"alta","src":["https://bichosdecampo.com/historico-trabajador-rural-en-san-andres-de-giles-juan-santos-ferrarotti-atesora-los-dias-gloriosos-de-la-fiesta-del-chancho-asado-con"],"v":"+"},{"y":2000,"t":"Primeros lotes del Sector Industrial","d":"La Ordenanza 646/2000 cedió lotes en el Sector Industrial municipal, que se amplió en 2004 junto a la Ruta 7.","L":"p","conf":"media","src":["https://hcdsanandresdegiles.com.ar/?s=industrial"],"v":"+"},{"y":2001,"t":"Aprobación del Plan Estratégico Urbano y Territorial","L":"p","v":"+","src":["https://hcdsanandresdegiles.com.ar/?s=codigo"],"d":"El Concejo sancionó la Ordenanza 652/2001, Código de Planeamiento Urbano, y la Resolución 190/01, que pide aprobar el plan de ordenamiento urbano y territorial."},{"y":2001,"t":"Asume Eduardo Mario Díaz","d":"Tras la renuncia de Nascimbene en octubre, completó el mandato hasta diciembre de 2003.","L":"p","conf":"alta","src":["https://sibom.slyt.gba.gob.ar/bulletins/11818/contents/2156719"],"v":"+"},{"y":2002,"t":"Normas de ordenamiento para el área rural","d":"La Ordenanza 745/2002 fijó lineamientos de ordenamiento para el área rural, complemento del código urbano de 2001.","L":"c","conf":"alta","src":["https://hcdsanandresdegiles.com.ar/?s=ordenamiento"],"v":"+"},{"y":2003,"t":"Asume Luis Alberto Ghione","d":"Fue electo en 2003, 2007 y 2011, y renunció en febrero de 2014.","L":"p","conf":"alta","src":["https://diariohoy.net/politica/renuncio-el-intendente-de-san-andres-de-giles-22492"],"v":"+"},{"y":2006,"t":"Bicentenario de San Andrés de Giles","d":"Se celebraron los 200 años de la primera misa del 30 de noviembre de 1806, que el partido toma como fecha fundacional.","L":"p","conf":" o":2010,"total":23027,"urbana":16243,"rural":6784},{"anio":2022,"total":26510,"urbana":20302,"rural":6208}],"acerca":["Línea histórica de San Andrés de Giles, iniciada en 2013 por el arquitecto Juan Patricio Addesso y ampliada en 2026. Cada hecho es un círculo que contiene a los anteriores: avanzar en el tiempo agranda el círculo; volver, lo achica.","Los colores siguen las convenciones de los planos de mensura: carmín para lo edificado (el pueblo), verde para el campo, azul para el contexto provincial y nacional. Las pérdidas (epidemias, cierres, inundaciones) van en amarillo y con trazo cortado, como lo que se demuele en un plano.","Las imágenes de Giles se muestran como copias heliográficas; las de la historia nacional, como fotografía de prensa. Cada epígrafe aclara si la imagen muestra el lugar hoy, es un documento de época de otro sitio o es un plano.","Cuando una fuente contradice un dato de la línea de 2013, el dato se conserva y la ficha muestra la revisión. Fuentes principales: la «Síntesis histórica» de Héctor F. Felice publicada por la Municipalidad, el libro del Hospital Municipal, los registros de cementerios, el buscador de ordenanzas del Concejo Deliberante, el Boletín Oficial municipal, normas.gba.gob.ar, el INDEC y la prensa local y regional. Imágenes: Wikimedia Commons (dominio público y licencias Creative Commons, con autor y licencia en cada epígrafe) y, del archivo de J. P. Addesso, el plano del partido de hacia 1890 y la fotografía de época de la plaza San Martín; las fotos de época del Digesto Gilense. El gobierno local de cada año sale de la «Historia de nuestras autoridades» del Digesto Gilense (surtecto.github.io/HCD-SAG-Digesto2026/autoridades.html), basada en la nómina de intendentes del archivo del Concejo Deliberante."],"pais":[{"y":1806,"t":"Invasiones inglesas","d":"Tropas británicas ocupan Buenos Aires en junio y son expulsadas en agosto; en 1807 un segundo ataque también es rechazado. Ese mismo año se celebra la primera misa en la Cañada de Giles.","img":"N01","cap":"Reconquista de Buenos Aires, grabado de 1807.","src":"https://es.wikipedia.org/wiki/Invasiones_inglesas"},{"y":1810,"t":"Revolución de Mayo","d":"El cabildo abierto del 22 de mayo destituye al virrey y el 25 asume la Primera Junta de gobierno.","img":"N02","cap":"El cabildo abierto del 22 de mayo, pintura de Pedro Subercaseaux, 1910.","src":"https://es.wikipedia.org/wiki/Revoluci%C3%B3n_de_Mayo"},{"y":1816,"t":"Declaración de la Independencia","d":"El Congreso reunido en San Miguel de Tucumán declara la independencia el 9 de julio.","img":"N03","cap":"Casa Histórica de la Independencia, Tucumán. Foto de 2012.","src":"https://es.wikipedia.org/wiki/Declaraci%C3%B3n_de_independencia_de_la_Argentina"},{"y":1829,"t":"Rosas gobierna Buenos Aires","d":"Juan Manuel de Rosas asume como gobernador; gobernará la provincia entre 1829 y 1832 y entre 1835 y 1852.","img":"N04","cap":"Retrato de Rosas por Raymond Monvoisin, 1842.","src":"https://es.wikipedia.org/wiki/Juan_Manuel_de_Rosas"},{"y":1852,"t":"Batalla de Caseros","d":"El Ejército Grande de Urquiza derrota a Rosas el 3 de febrero y termina su gobierno.","img":"N05","cap":"La batalla de Caseros, litografía de 1852.","src":"https://es.wikipedia.org/wiki/Batalla_de_Caseros"},{"y":1853,"t":"Constitución Nacional","d":"El Congreso Constituyente reunido en Santa Fe sanciona la Constitución el 1 de mayo. Buenos Aires se incorpora en 1860.","img":"N06","cap":"Primera página del manuscrito original de la Constitución.","src":"https://es.wikipedia.org/wiki/Constituci%C3%B3n_de_la_Naci%C3%B3n_Argentina"},{"y":1865,"t":"Guerra del Paraguay","d":"Argentina, Brasil y Uruguay combaten contra Paraguay hasta 1870. La batalla de Tuyutí, de 1866, dará nombre a una estación del partido.","img":"N07","cap":"Batalla de Tuyutí, de Cándido López, 1866.","src":"https://es.wikipedia.org/wiki/Guerra_de_la_Triple_Alianza"},{"y":1869,"t":"Primer censo nacional","d":"Bajo la presidencia de Sarmiento se cuentan 1.877.490 habitantes en todo el país.","img":"N08","cap":"Domingo F. Sarmiento, retrato de hacia 1884.","src":"https://es.wikipedia.org/wiki/Censo_argentino_de_1869"},{"y":1871,"t":"Fiebre amarilla en Buenos Aires","d":"La epidemia mata a más de trece mil personas en la ciudad y empuja obras de agua corriente y cloacas.","img":"N09","cap":"Un episodio de la fiebre amarilla en Buenos Aires, de Juan Manuel Blanes, 1871.","src":"https://es.wikipedia.org/wiki/Epidemia_de_fiebre_amarilla_de_Buenos_Aires"},{"y":1879,"t":"Campaña al Desierto","d":"El Ejército ocupa los territorios indígenas de la pampa y la Patagonia; miles de indígenas mueren, son desplazados o tomados prisioneros, y las tierras pasan a manos privadas.","img":"N10","cap":"La conquista del desierto, de Juan Manuel Blanes, 1889 (fragmento).","src":"https://es.wikipedia.org/wiki/Conquista_del_Desierto"},{"y":1880,"t":"Federalización de Buenos Aires","d":"Tras un enfrentamiento armado, la ciudad de Buenos Aires pasa a ser Capital Federal; Julio A. Roca asume la presidencia. La provincia funda La Plata en 1882.","img":"N11","cap":"Julio Argentino Roca.","src":"https://es.wikipedia.org/wiki/Federalizaci%C3%B3n_de_Buenos_Aires"},{"y":1885,"t":"La red ferroviaria se expande","d":"Entre 1880 y 1914 las vías pasan de unos 2.500 a más de 30.000 kilómetros, con la llanura pampeana como centro.","img":"N30","cap":"La estación Retiro del Ferrocarril Central Argentino, fines del siglo XIX.","src":"https://es.wikipedia.org/wiki/Historia_del_ferrocarril_en_Argentina"},{"y":1890,"t":"Revolución del Parque","d":"Un levantamiento cívico-militar en Buenos Aires, en plena crisis económica, provoca la renuncia del presidente Juárez Celman.","img":"N13","cap":"Escena de la Revolución del Parque, dibujo de 1890.","src":"https://es.wikipedia.org/wiki/Revoluci%C3%B3n_del_Parque"},{"y":1895,"t":"Inmigración masiva","d":"El segundo censo nacional registra 3.954.911 habitantes; uno de cada cuatro nació en el extranjero, sobre todo en Italia y España.","img":"N12","cap":"Inmigrantes polacos en el antiguo Hotel de Inmigrantes, hacia 1890. Archivo General de la Nación.","src":"https://es.wikipedia.org/wiki/Inmigraci%C3%B3n_en_Argentina"},{"y":1898,"t":"Nace Caras y Caretas","d":"La revista ilustrada combina caricatura, fotografía y actualidad, y se vuelve el gran semanario popular de la época.","img":"N14","cap":"Tapa de Caras y Caretas, octubre de 1898.","src":"https://es.wikipedia.org/wiki/Caras_y_Caretas_(Argentina)"},{"y":1910,"t":"Centenario de la Revolución","d":"Buenos Aires celebra el Centenario con exposiciones internacionales, iluminación de la Avenida de Mayo y estado de sitio.","img":"N15","cap":"La Avenida de Mayo iluminada para el Centenario, mayo de 1910.","src":"https://es.wikipedia.org/wiki/Centenario_de_Argentina"},{"y":1912,"t":"Ley Sáenz Peña","d":"Se establece el voto secreto y obligatorio para los varones ciudadanos.","img":"N16","cap":"Tapa de Caras y Caretas sobre las elecciones, 30 de marzo de 1912.","src":"https://es.wikipedia.org/wiki/Ley_S%C3%A1enz_Pe%C3%B1a"},{"y":1916,"t":"Yrigoyen presidente","d":"Hipólito Yrigoyen es el primer presidente elegido con la nueva ley electoral.","img":"N17","cap":"Yrigoyen en el coche presidencial por la Avenida de Mayo, 12 de octubre de 1916.","src":"https://es.wikipedia.org/wiki/Hip%C3%B3lito_Yrigoyen"},{"y":1918,"t":"Reforma Universitaria","d":"Los estudiantes de Córdoba reclaman autonomía, cogobierno y libertad de cátedra; el movimiento se extiende por América Latina.","img":"N18","cap":"Estudiantes en Córdoba, 15 de agosto de 1918.","src":"https://es.wikipedia.org/wiki/Reforma_universitaria_de_1918"},{"y":1930,"t":"Primer golpe de Estado","d":"El 6 de septiembre el general José Félix Uriburu derroca a Yrigoyen. Comienza la llamada Década Infame.","img":null,"cap":"","src":"https://es.wikipedia.org/wiki/Golpe_de_Estado_en_Argentina_de_1930"},{"y":1945,"t":"17 de octubre","d":"Una multitud de trabajadores llena la Plaza de Mayo y reclama l function rel(j, i0){

stage.addEventListener('pointerdown', ev => { drag = {x: ev.clientX, y: ev.clientY, t0: target, moved: false}; cv.style.cursor = 'grabbing'; });
addEventListener('pointermove', ev => {
  if (!drag){ hover(ev); return; }
  const dy = ev.clientY - drag.y, dx = ev.clientX - drag.x, d = Math.abs(dy) > Math.abs(dx) ? -dy : -dx;
  if (Math.abs(d) > 6) drag.moved = true;
  if (drag.moved){ stopPlay(); target = Math.max(0, Math.min(seq.length-1, drag.t0 + d/120)); dirty = true; updateFicha(); }
});
addEventListener('pointerup', ev => {
  if (!drag) return; const moved = drag.moved; drag = null; cv.style.cursor = 'grab';
  if (moved){ go(Math.round(target)); return; }
  const r = stage.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (x < 0 || y < 0 || x > r.width || y > r.height) return;
  const hit = pick(x, y); if (hit != null && hit !== Math.round(target)){ stopPlay(); go(hit); }
});
function pick(x, y){ let best = null; for (const g of geom){ if (g.r < 14) continue; if (Math.hypot(x - g.x, y - g.y) <= g.r && (best === null || g.r < best.r)) best = g; } return best ? best.j : Math.min(seq.length-1, Math.round(target) + 1); }
function hover(ev){ const r = stage.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top; if (x < 0 || y < 0 || x > r.width || y > r.height) return; const h = pick(x, y); cv.style.cursor = (h != null && h !== Math.round(target)) ? 'pointer' : 'grab'; }

readTokens();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
new ResizeObserver(resize).observe(stage);
addEventListener('resize', () => drawTimeline());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => dirty = true);
buildSeq(null);
{ const f = seq.findIndex(i => ALL[i].y === 1806 && ALL[i].img); if (f >= 0){ c = target = f; updateFicha(true); } }
resize();
requestAnimationFrame(loop);
})();
